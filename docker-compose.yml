services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fieldcoach
      POSTGRES_PASSWORD: fieldcoach
      POSTGRES_DB: fieldcoach
    ports:
      - "5433:5432"   # host 5433 so it won't clash with a local Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldcoach -d fieldcoach"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://fieldcoach:fieldcoach@db:5432/fieldcoach
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FIELDCOACH_MODEL: ${FIELDCOACH_MODEL:-claude-sonnet-5-5}
      PORT: "8080"
    ports:
      - "8000:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
