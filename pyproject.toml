[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldcoach"
version = "0.1.0"
description = "AI coaching for in-person field sales, demoed on synthetic pharmacy-sales meetings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.10,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
fieldcoach = "fieldcoach.cli:main"

[tool.setuptools]
packages = ["fieldcoach"]

[tool.setuptools.package-data]
fieldcoach = ["prompts/*.md", "templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
